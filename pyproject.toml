[project]
name = "interskein"
version = "0.2.0"
description = "Agent knowledge management: local folios with a signed publish-to-mesh boundary"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Patrick Smyth", email = "website@pbsmyth.com"},
]
keywords = ["ai", "agents", "knowledge-management", "folios", "sigstore", "mesh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.12.0",
    "click>=8.1.0",
    "requests>=2.32.0",
    "GitPython>=3.1.0",
    "jinja2>=3.0.0",
    # Imported directly by skein/web/app.py to render folio bodies; declared here
    # so `pip install interskein` provides it rather than relying on a transitive.
    "markdown-it-py>=3.0.0",
    # Canon line: 0.3.x was the original reviewed baseline (brief-20260603-n22c:
    # exact-decimal integers, MAX_INT_DIGITS/MAX_DEPTH, Cn-rejection). 0.5.x
    # re-reviewed at the Stage 4 cutover: the skein.folio.canon/v1 conformance
    # vectors (test_canon_conformance.py) pass byte-identically under both 0.3.x
    # and 0.5.x, so the canonical bytes are unchanged across the range. 0.6 stays
    # capped pending the same conformance check.
    "knurl>=0.3.0,<0.6.0",
    "sigstore>=4.2,<5",
    # signing.py imports cryptography directly (was riding in transitively via
    # sigstore); declared explicitly now that signing lives in this package.
    "cryptography>=42,<47",
]

[project.optional-dependencies]
# The client-side mesh MCP wrapper (`mesh mcp`). Optional so the instance image
# and `mesh fetch` stay lean — instances are HTTP-only and never run MCP.
mesh-mcp = ["mcp>=1.2"]  # FastMCP (mcp.server.fastmcp) lands in the SDK at 1.2
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "aiohttp>=3.9.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "types-requests>=2.31.0",
    "hypothesis>=6.0.0",
]

[project.scripts]
skein = "skein.cli:main"
mesh = "skein.mesh.cli:main"

[project.urls]
Homepage = "https://github.com/spiritengine/skein"
Repository = "https://github.com/spiritengine/skein"
Documentation = "https://github.com/spiritengine/skein/blob/main/README.md"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["skein*"]

[tool.setuptools.package-data]
skein = ["web/templates/*.html", "web/static/*.css", "web/static/themes/*.css"]

[tool.pytest.ini_options]
testpaths = ["skein/tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "conformance_staging: tests that verify against staging Sigstore TUF root (offline, no network needed)",
    "conformance_online: tests that require live Sigstore staging network access",
    "staging: live Sigstore staging integration (skipped unless SKEIN_TEST_SIGSTORE_LIVE=1)",
    "interactive: requires --run-interactive (human-in-the-loop browser-driven OAuth2 handshake; never CI)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
skip = [".git", "__pycache__", ".venv", "build", "dist"]

[tool.ruff]
# CI gates on `ruff check` (the linter), not `ruff format` — the codebase is
# hand-formatted (black/isort, 100 cols), and a wholesale ruff-format reflow would
# churn carefully-written code for no bug-catching gain. Match the house width so
# any width-sensitive rule agrees with black/isort.
line-length = 100
# docs/emoji-codec holds a standalone alphabet-generator script, not package source.
extend-exclude = ["docs"]

[tool.ruff.lint.per-file-ignores]
# The signing bit-flip probe deliberately imports after an explanatory setup
# block (E402) — the staging is intentional, not an accident.
"skein/tests/test_signing/bit_flip_matrix_probe.py" = ["E402"]
# Tests use terse fixture names by convention (e.g. I = OIDC issuer, S = subject).
"skein/tests/**" = ["E741"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "build",
    "dist",
    ".venv",
]

[tool.coverage.run]
source = ["skein"]
omit = ["skein/tests/*", "*.pyc"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
