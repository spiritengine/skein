name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          # Install from requirements-dev.txt (not an ad-hoc unpinned list) so
          # lint uses the same pinned ruff version as local dev and `test.yml`
          # -- an unpinned `pip install ruff` drifts to whatever's newest on
          # each run, and a new ruff release enabling new default rules can
          # fail the build on code nobody touched.
          pip install -r requirements-dev.txt

      # Formatting is NOT gated: the codebase is hand-formatted (black/isort, 100
      # cols) and a wholesale `ruff format` reflow would churn carefully-written
      # code for no bug-catching gain. The linter (`ruff check`) is the real gate.
      - name: Lint with ruff
        run: |
          ruff check .

      - name: Type check with mypy
        run: |
          mypy skein/ client/ --ignore-missing-imports --no-error-summary || true
