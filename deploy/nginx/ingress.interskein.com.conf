# Public write surface for interskein.com — the signed-publish ingress.
#
# Fronts the loopback-only ingress (127.0.0.1:9101) as
# https://ingress.interskein.com. The ingress stays bound to 127.0.0.1 (Docker
# bypasses UFW via iptables, so a bare host port would be public regardless of
# the firewall) — nginx is the ONLY public listener, exactly like the read vhost.
#
# The protection is the crypto+binding gate inside the app, never obscurity: an
# unbound or unsigned publish is rejected at the ingress. nginx adds the DoS
# perimeter: a body-size cap, per-IP rate limiting, and short timeouts so a
# public POST endpoint that does per-publish Sigstore verification cannot be
# floored by oversized/flood/slow-loris traffic.
#
# Deploy: see docs/PUBLIC_INGRESS_OPERATIONS.md. The limit_req_zone below MUST
# live in the http{} context — keep it in conf.d (a server{} block cannot hold
# it). The cert is issued separately (certbot certonly), then this vhost is
# dropped into sites-available and symlinked.

# --- http{} context: rate-limit zones (put this file in /etc/nginx/conf.d/) ---
# 10 requests/minute per client IP, with a small burst. A human collaborator
# publishes occasionally; this stops probing/flood without anyone legitimate
# noticing. The zone keyed on $binary_remote_addr; 10m holds ~160k IPs.
limit_req_zone $binary_remote_addr zone=publish_zone:10m rate=10r/m;

# TIGHTER zone for /invite/redeem: a collaborator redeems ONCE, ever, so the
# legitimate rate is far lower than publish. Each redeem does an expensive Sigstore
# verify before the cheap checks can burn the token, and a leaked-but-unused token
# is not burned until success — so a low per-IP cap here is the front-line against
# the repeated-verify flood (the app's per-token attempt cap is the backstop behind
# it). 5 requests/minute per IP, minimal burst.
limit_req_zone $binary_remote_addr zone=redeem_zone:10m rate=5r/m;

# --- :80 — ACME challenge passthrough + redirect everything else to https ----
server {
    listen 80;
    listen [::]:80;
    server_name ingress.interskein.com;

    # Let certbot renew over http-01 without disturbing the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- :443 — the public publish endpoint --------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # NOTE: the standalone `http2 on;` directive needs nginx >= 1.25.1; the
    # droplet's nginx predates it (the read vhost runs without http2 too). On a
    # newer nginx, add `http2 on;` here or use the old `listen 443 ssl http2;`.
    server_name ingress.interskein.com;

    ssl_certificate     /etc/letsencrypt/live/ingress.interskein.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ingress.interskein.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;     # certbot's hardened TLS defaults
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # DoS perimeter -----------------------------------------------------------
    # Body cap MUST match the app's MAX_BATCH_BYTES (skein/ingress.py = 1 MiB).
    # Bump BOTH together if a legitimate publish ever needs more headroom.
    client_max_body_size 1m;
    # Slow-loris mitigation: cap how long a client may take to send headers/body.
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    # Don't leak the nginx version on errors/headers.
    server_tokens off;

    # The ingress has exactly TWO public routes. Proxy only them; POST only; each
    # rate-limited by its own zone.
    location = /publish/v0/folios {
        limit_except POST { deny all; }
        limit_req zone=publish_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:9101;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    30s;   # Sigstore verification can take a beat
        # Buffer the (≤1 MiB) request fully at nginx before it reaches uvicorn, so
        # a slow client can't hold an app worker open mid-body.
        proxy_request_buffering on;
    }

    # The redeem route — its OWN location, its OWN tighter zone, and a SMALLER body
    # cap matching the app's REDEEM_MAX_BYTES (64 KiB: one {token, proof}). A redeem
    # does an expensive Sigstore verify, so this zone is stricter than publish.
    location = /invite/redeem {
        limit_except POST { deny all; }
        limit_req zone=redeem_zone burst=2 nodelay;
        limit_req_status 429;

        # Match skein/ingress.py REDEEM_MAX_BYTES. Bump BOTH together if a real
        # redeem body ever needs more (it should not — it is one Sigstore bundle).
        client_max_body_size 64k;

        proxy_pass http://127.0.0.1:9101;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    30s;   # Sigstore verification can take a beat
        proxy_request_buffering on;
    }

    # Nothing else is a valid write target. Close, don't hint at a surface.
    location / {
        return 404;
    }
}
